<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔎</text></svg>">
<style>body{margin:0}</style>
<title>Emoji Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky search console on top, emoji grid in the middle, a detail + copy bar pinned to the bottom */
:root {
  --bg: #F1F2F6;
  --surface: #FFFFFF;
  --ink: #15171C;
  --muted: #5F6574;
  --line: #DADDE5;
  --hover: #E4E6EE;
  --accent: #FFC531;      /* sticker yellow: primary action + selection */
  --accent-ring: #E3A600;
  --sel: #FFEDB3;
  --on-accent: #15171C;
  --toast-bg: #15171C;
  --toast-fg: #FFFFFF;
  --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --body: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  --head-h: 180px;
  --bar-h: 96px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111318; --surface: #1A1D24; --ink: #ECEDF2; --muted: #9298A6; --line: #2B2F3A;
    --hover: #242833; --accent: #FFC531; --accent-ring: #FFC531; --sel: rgba(255,197,49,.17);
    --on-accent: #15171C; --toast-bg: #ECEDF2; --toast-fg: #15171C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111318; --surface: #1A1D24; --ink: #ECEDF2; --muted: #9298A6; --line: #2B2F3A;
  --hover: #242833; --accent: #FFC531; --accent-ring: #FFC531; --sel: rgba(255,197,49,.17);
  --on-accent: #15171C; --toast-bg: #ECEDF2; --toast-fg: #15171C; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); }
.top .wrap { padding-block: 20px 10px; display: flex; flex-direction: column; gap: 14px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: -0.02em; line-height: 1; }
h1 span { font-family: var(--emoji); font-size: 22px; margin-left: 2px; }
.keys { margin: 0; color: var(--muted); font-size: 12.5px; display: flex; gap: 14px; flex-wrap: wrap; }
kbd { font-family: var(--mono); font-size: 11px; padding: 1px 5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; background: var(--surface); color: var(--ink); }

.searchrow { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
.search { flex: 1 1 320px; min-width: 0; position: relative; display: flex; align-items: center; }
.search svg { position: absolute; left: 16px; width: 20px; height: 20px; color: var(--muted); pointer-events: none; }
#q { width: 100%; height: 54px; padding: 0 44px 0 48px; font: 500 18px/1 var(--body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; outline: none; transition: border-color .12s, box-shadow .12s; }
#q::placeholder { color: var(--muted); font-weight: 400; }
#q:focus { border-color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 45%, transparent); }
#q::-webkit-search-cancel-button { display: none; }
#clear { position: absolute; right: 10px; width: 30px; height: 30px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; }
#clear:hover { background: var(--hover); color: var(--ink); }

.tones { display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--surface); border: 1.5px solid var(--line); border-radius: 14px; }
.tones button { width: 40px; height: 42px; border: 0; border-radius: 10px; background: transparent; font: 22px/1 var(--emoji); cursor: pointer; }
.tones button:hover { background: var(--hover); }
.tones button[aria-checked="true"] { background: var(--sel); box-shadow: inset 0 0 0 2px var(--accent-ring); }

.cats { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -4px; padding: 2px 4px; }
.cats::-webkit-scrollbar { display: none; }
.cats button { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); font: 500 13px/1 var(--body); cursor: pointer; white-space: nowrap; }
.cats button i { font: normal 16px/1 var(--emoji); }
.cats button:hover { border-color: var(--muted); }
.cats button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }

button:focus-visible, .tile.kbd { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---------- results ---------- */
main .wrap { padding-block: 6px calc(var(--bar-h) + 28px); }
.sect { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; }
.sect h2 { margin: 0; display: flex; align-items: baseline; gap: 8px; font: 600 12px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sect h2 small { font: 400 11px/1 var(--mono); letter-spacing: 0; text-transform: none; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(50px, 1fr)); gap: 2px; }
.tile { aspect-ratio: 1; max-width: 100%; display: grid; place-items: center; border: 0; border-radius: 11px; background: transparent; font: 30px/1 var(--emoji); cursor: pointer; padding: 0; scroll-margin: calc(var(--head-h) + 8px) 0 calc(var(--bar-h) + 12px); transition: transform .08s; }
.tile:hover { background: var(--hover); }
.tile.sel { background: var(--sel); box-shadow: inset 0 0 0 2px var(--accent-ring); }
.tile.pop { animation: pop .28s ease-out; }
@keyframes pop { 40% { transform: scale(1.22); } }
.empty { padding: 48px 0; text-align: center; color: var(--muted); font-size: 15px; }
.empty b { color: var(--ink); font-weight: 600; }

/* ---------- bottom bar ---------- */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: 0 -8px 24px rgba(0,0,0,.04); }
.bar .wrap { padding-block: 12px; display: flex; flex-direction: column; gap: 10px; }
.detail { display: flex; align-items: center; gap: 14px; min-height: 52px; }
.big { flex: none; width: 52px; height: 52px; display: grid; place-items: center; font: 42px/1 var(--emoji); user-select: all; -webkit-user-select: all; }
.info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.info .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info .name::first-letter { text-transform: uppercase; }
.info .meta { font: 400 12px/1.3 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hintline { color: var(--muted); font-size: 13.5px; }
.actions { display: flex; gap: 8px; flex: none; }
.btn { height: 42px; padding: 0 16px; border-radius: 11px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font: 600 14px/1 var(--body); cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(.96); }
.btn:disabled { opacity: .45; cursor: default; }
.tray { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: 12px; background: var(--bg); }
.tray .lbl { font: 600 11px/1 var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); flex: none; }
.tray .str { flex: 1; min-width: 0; font: 24px/1.2 var(--emoji); overflow-x: auto; white-space: nowrap; scrollbar-width: none; user-select: all; -webkit-user-select: all; }
.tray .btn { height: 36px; }

.toast { position: fixed; left: 50%; bottom: calc(var(--bar-h) + 14px); transform: translate(-50%, 8px); opacity: 0; pointer-events: none; z-index: 8; background: var(--toast-bg); color: var(--toast-fg); padding: 10px 16px; border-radius: 12px; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px; transition: opacity .16s, transform .16s; max-width: calc(100vw - 32px); }
.toast i { font: normal 20px/1 var(--emoji); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 560px) {
  .keys { display: none; }
  .tones button { width: 34px; }
  .search { flex-basis: 100%; }
  .tones { width: 100%; justify-content: space-between; }
  .info .meta { display: none; }
  #addBtn { display: none; }
  .grid { grid-template-columns: repeat(auto-fill, minmax(44px, 1fr)); }
  .tile { font-size: 28px; }
}
@media (prefers-reduced-motion: reduce) {
  .tile.pop { animation: none; }
  .toast, #q { transition: none; }
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <h1>Emoji Finder <span aria-hidden="true">🔎</span></h1>
      <p class="keys"><span>Type to search</span><span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> move</span><span><kbd>↵</kbd> copy</span><span><kbd>⇧</kbd><kbd>↵</kbd> collect several</span><span><kbd>esc</kbd> clear</span></p>
    </div>
    <div class="searchrow">
      <label class="search" for="q">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>
        <input id="q" type="search" placeholder="Search emoji: fire, thumbs up, party, :tada:" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="Search emoji" aria-controls="results" autofocus>
        <button id="clear" type="button" aria-label="Clear search" hidden>×</button>
      </label>
      <div class="tones" id="tones" role="radiogroup" aria-label="Skin tone"></div>
    </div>
    <nav class="cats" id="cats" aria-label="Categories"></nav>
  </div>
</header>

<main><div class="wrap" id="results" role="listbox" aria-label="Emoji"></div></main>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="tray" id="tray" hidden>
      <span class="lbl">Collected</span>
      <span class="str" id="trayStr"></span>
      <button class="btn" id="trayClear" type="button">Clear</button>
      <button class="btn primary" id="trayCopy" type="button">Copy all</button>
    </div>
    <div class="detail">
      <div class="big" id="big" aria-hidden="true">👆</div>
      <div class="info" id="info">
        <div class="hintline">Click any emoji to copy it, then paste with <kbd>⌘</kbd><kbd>V</kbd>. Shift-click to collect several.</div>
      </div>
      <div class="actions">
        <button class="btn" id="addBtn" type="button" disabled>Collect</button>
        <button class="btn primary" id="copyBtn" type="button" disabled>Copy</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

const GROUPS = [
  [0, "Smileys", "Smileys & emotion", "😀"],
  [1, "People", "People & body", "👋"],
  [3, "Animals & nature", "Animals & nature", "🐻"],
  [4, "Food & drink", "Food & drink", "🍔"],
  [5, "Travel", "Travel & places", "✈️"],
  [6, "Activities", "Activities", "⚽"],
  [7, "Objects", "Objects", "💡"],
  [8, "Symbols", "Symbols", "❤️"],
  [9, "Flags", "Flags", "🏁"],
];
const TONES = ["✋", "✋🏻", "✋🏼", "✋🏽", "✋🏾", "✋🏿"];
const TONE_NAMES = ["Default", "Light", "Medium-light", "Medium", "Medium-dark", "Dark"];

const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const splitWords = s => norm(s).split(/[\s:,.'’“”()!&-]+/).filter(Boolean);

const items = DATA.map((r, i) => ({
  ch: r[0], name: r[1], g: r[3], sc: r[4], skins: r[6] || null, i,
  nname: norm(r[1]),
  words: splitWords(r[1]),
  kwords: splitWords(r[2] + " " + r[4].replace(/_/g, " ") + " " + r[4].replace(/:/g, "")),
}));
const byChar = new Map();
items.forEach(it => { byChar.set(it.ch, it); (it.skins || []).forEach(s => byChar.set(s, it)); });

/* ---------- per-viewer preferences ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
let tone = store.get("ef.tone", 0);
let recent = store.get("ef.recent", []).filter(c => byChar.has(c));
let cat = -1, query = "", tiles = [], selIdx = -1, tray = "";

const $ = id => document.getElementById(id);
const q = $("q"), results = $("results");
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const glyph = it => (tone && it.skins ? it.skins[tone - 1] : it.ch);
const codepoints = s => [...s].map(c => "U+" + c.codePointAt(0).toString(16).toUpperCase().padStart(4, "0")).join(" ");
const finePointer = matchMedia("(pointer: fine)").matches;

/* ---------- search ---------- */
function search(raw) {
  const trimmed = raw.trim();
  const direct = byChar.get(trimmed);
  if (direct) return [direct];
  const toks = splitWords(raw);
  if (!toks.length) return [];
  const whole = toks.join(" ");
  const out = [];
  for (const it of items) {
    if (cat >= 0 && it.g !== cat) continue;
    let s = 0, ok = true;
    for (const t of toks) {
      let best = 0;
      for (const w of it.words) { if (w === t) { best = 3; break; } if (best < 2 && w.startsWith(t)) best = 2; }
      if (!best) for (const w of it.kwords) { if (w === t) { best = 1.5; break; } if (best < 1 && w.startsWith(t)) best = 1; }
      if (!best && t.length > 2 && it.nname.includes(t)) best = 0.5;
      if (!best) { ok = false; break; }
      s += best;
    }
    if (!ok) continue;
    if (it.nname === whole) s += 10; else if (it.nname.startsWith(whole)) s += 3;
    s -= it.words.length * 0.08;          // shorter names are usually the one you meant
    if (it.g === 9) s -= 0.5;             // flags rarely beat a direct match
    out.push([s, it]);
  }
  out.sort((a, b) => b[0] - a[0] || a[1].i - b[1].i);
  return out.map(x => x[1]);
}

/* ---------- rendering ---------- */
let tileN = 0;
const tileHTML = it => `<button class="tile" type="button" tabindex="-1" role="option" id="t${tileN++}" data-k="${it.i}" title="${esc(it.name)}" aria-label="${esc(it.name)}">${glyph(it)}</button>`;
const section = (title, list, note) =>
  `<section class="sect" role="group" aria-label="${esc(title)}"><h2>${esc(title)} <small>${note ?? list.length}</small></h2><div class="grid">${list.map(tileHTML).join("")}</div></section>`;

function render(keepSel) {
  tileN = 0;
  const prevKey = keepSel && selIdx >= 0 ? tiles[selIdx]?.dataset.k : null;
  const qq = query.trim();
  let html = "";
  if (qq) {
    const res = search(query);
    if (res.length) {
      const where = cat >= 0 ? ` in ${GROUPS.find(g => g[0] === cat)[2]}` : "";
      html = section(`Results for “${qq}”${where}`, res, `${res.length} found`);
    } else {
      html = `<div class="empty">Nothing matches <b>“${esc(qq)}”</b>${cat >= 0 ? " in this category" : ""}.<br>Try a simpler word, like <b>cat</b>, <b>love</b> or <b>party</b>.</div>`;
    }
  } else {
    if (cat < 0 && recent.length) html += section("Recently copied", recent.map(c => byChar.get(c)), "");
    for (const [g, , full] of GROUPS) {
      if (cat >= 0 && g !== cat) continue;
      html += section(full, items.filter(it => it.g === g));
    }
  }
  results.innerHTML = html;
  tiles = [...results.querySelectorAll(".tile")];
  selIdx = -1;
  let idx = prevKey != null ? tiles.findIndex(t => t.dataset.k === prevKey) : -1;
  if (idx < 0 && qq && tiles.length) idx = 0;
  if (idx >= 0) setSel(idx, false); else showDetail(null);
}

function setSel(i, scroll, fromKeys) {
  if (selIdx >= 0 && tiles[selIdx]) tiles[selIdx].classList.remove("sel", "kbd");
  selIdx = i;
  const t = tiles[i];
  if (!t) { q.removeAttribute("aria-activedescendant"); showDetail(null); return; }
  t.classList.add("sel");
  if (fromKeys) t.classList.add("kbd");
  q.setAttribute("aria-activedescendant", t.id);
  if (scroll) t.scrollIntoView({ block: "nearest" });
  showDetail(items[+t.dataset.k]);
}

let shown = null;
function showDetail(it) {
  shown = it;
  $("copyBtn").disabled = !it;
  $("addBtn").disabled = !it;
  if (!it) {
    $("big").textContent = "👆";
    $("info").innerHTML = `<div class="hintline">Click any emoji to copy it, then paste with <kbd>⌘</kbd><kbd>V</kbd>. Shift-click to collect several.</div>`;
    return;
  }
  const g = glyph(it);
  $("big").textContent = g;
  const meta = [it.sc, codepoints(g)].filter(Boolean).join("  ·  ");
  $("info").innerHTML = `<div class="name">${esc(it.name)}</div><div class="meta">${esc(meta)}</div>`;
}

/* ---------- copying ---------- */
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand("copy"); } catch {}
    ta.remove(); return ok;
  };
  if (navigator.clipboard?.writeText) return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  return Promise.resolve(fallback());
}

let toastTimer;
function toast(icon, msg) {
  const el = $("toast");
  el.innerHTML = (icon ? `<i>${icon}</i>` : "") + `<span>${esc(msg)}</span>`;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1600);
}

function remember(it) {
  recent = [it.ch, ...recent.filter(c => c !== it.ch)].slice(0, 30);
  store.set("ef.recent", recent);
}

function copyItem(it, tileEl) {
  const g = glyph(it);
  copyText(g).then(ok => {
    if (ok) { toast(g, `Copied ${it.name}`); remember(it); }
    else toast("", "Your browser blocked copying. Select the emoji in the bar below and press ⌘C.");
  });
  if (tileEl) { tileEl.classList.remove("pop"); void tileEl.offsetWidth; tileEl.classList.add("pop"); }
}

function collect(it) {
  tray += glyph(it);
  remember(it);
  updateTray();
  toast(glyph(it), "Added. Press Copy all when you're done.");
}
function updateTray() {
  $("tray").hidden = !tray;
  $("trayStr").textContent = tray;
  $("trayCopy").textContent = `Copy all (${(window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(tray)].length:[...tray].length)})`;
  measure();
}

/* ---------- controls ---------- */
$("tones").innerHTML = TONES.map((t, i) =>
  `<button type="button" role="radio" aria-checked="${i === tone}" aria-label="${TONE_NAMES[i]} skin tone" title="${TONE_NAMES[i]} skin tone" data-t="${i}">${t}</button>`).join("");
$("tones").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  tone = +b.dataset.t; store.set("ef.tone", tone);
  $("tones").querySelectorAll("button").forEach(x => x.setAttribute("aria-checked", x === b));
  render(true);
});

$("cats").innerHTML = `<button type="button" data-c="-1" aria-pressed="true">All</button>` +
  GROUPS.map(([g, short, , ic]) => `<button type="button" data-c="${g}" aria-pressed="false"><i aria-hidden="true">${ic}</i>${short}</button>`).join("");
$("cats").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  cat = +b.dataset.c;
  $("cats").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
  render(false);
  window.scrollTo({ top: 0 });
  if (finePointer) q.focus({ preventScroll: true });
});

q.addEventListener("input", () => {
  query = q.value;
  $("clear").hidden = !query;
  render(false);
  window.scrollTo({ top: 0 });
});
$("clear").addEventListener("click", () => { q.value = ""; q.dispatchEvent(new Event("input")); q.focus(); });

results.addEventListener("click", e => {
  const t = e.target.closest(".tile"); if (!t) return;
  const it = items[+t.dataset.k];
  setSel(tiles.indexOf(t), false);
  if (e.shiftKey) collect(it); else copyItem(it, t);
  if (finePointer) q.focus({ preventScroll: true });
});
results.addEventListener("mouseover", e => {
  const t = e.target.closest(".tile"); if (!t || !finePointer) return;
  const i = tiles.indexOf(t); if (i !== selIdx) setSel(i, false);
});

$("copyBtn").addEventListener("click", () => {
  if (!shown) return;
  copyItem(shown, tiles[selIdx]);
});
$("addBtn").addEventListener("click", () => { if (shown) collect(shown); });
$("trayCopy").addEventListener("click", () => {
  const n = $("trayCopy").textContent.match(/\d+/)?.[0] ?? "";
  copyText(tray).then(ok => toast(ok ? tray.slice(0, 16) : "", ok ? `Copied ${n} emoji` : "Your browser blocked copying. Select them above and press ⌘C."));
});
$("trayClear").addEventListener("click", () => { tray = ""; updateTray(); });

/* keyboard: arrows move through the grid, Enter copies, Esc clears */
function move(key) {
  if (!tiles.length) return;
  if (selIdx < 0) return setSel(0, true, true);
  if (key === "ArrowLeft") return setSel(Math.max(0, selIdx - 1), true, true);
  if (key === "ArrowRight") return setSel(Math.min(tiles.length - 1, selIdx + 1), true, true);
  const down = key === "ArrowDown";
  const r = tiles[selIdx].getBoundingClientRect();
  const cx = r.left + r.width / 2;
  let rowTop = null, best = -1, bestDx = Infinity;
  for (let j = selIdx + (down ? 1 : -1); down ? j < tiles.length : j >= 0; j += down ? 1 : -1) {
    const b = tiles[j].getBoundingClientRect();
    if (down ? b.top <= r.top + 2 : b.top >= r.top - 2) continue;
    if (rowTop === null) rowTop = b.top; else if (Math.abs(b.top - rowTop) > 2) break;
    const dx = Math.abs(b.left + b.width / 2 - cx);
    if (dx < bestDx) { bestDx = dx; best = j; }
  }
  if (best >= 0) setSel(best, true, true);
  else if (!down) window.scrollTo({ top: 0 });
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k.startsWith("Arrow")) { e.preventDefault(); move(k); return; }
  if (k === "Enter") {
    if (document.activeElement && document.activeElement !== q && document.activeElement.tagName === "BUTTON" && !document.activeElement.classList.contains("tile")) return;
    const it = selIdx >= 0 ? items[+tiles[selIdx].dataset.k] : null;
    if (!it) return;
    e.preventDefault();
    if (e.shiftKey) collect(it); else copyItem(it, tiles[selIdx]);
    return;
  }
  if (k === "Escape") {
    e.preventDefault();
    if (q.value) { q.value = ""; q.dispatchEvent(new Event("input")); }
    else setSel(-1);
    q.focus({ preventScroll: true });
    return;
  }
  if (document.activeElement !== q && (k.length === 1 || k === "Backspace")) q.focus({ preventScroll: true });
});

/* keep sticky header and bottom bar heights in CSS so scrolled tiles never hide under them */
function measure() {
  document.documentElement.style.setProperty("--head-h", $("top").offsetHeight + "px");
  document.documentElement.style.setProperty("--bar-h", $("bar").offsetHeight + "px");
}
new ResizeObserver(measure).observe(document.body);

render(false);
measure();
</script>
</body>
